<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img"
     aria-label="Seyed Alireza Alhosseini Almodarresieh wordmark — abstract node-graph mark.">
  <defs>
    <linearGradient id="am-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#7c4dff"/>
      <stop offset="100%" stop-color="#38e8d4"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="30" height="30" rx="7" fill="#0c1226" stroke="rgba(255,255,255,0.12)"/>
  <!-- edges -->
  <path d="M8,9 L16,12 L24,9 M16,12 L16,22 M16,22 L9,24 M16,22 L23,24"
        stroke="url(#am-edge)" stroke-width="1.2" fill="none" opacity="0.85"/>
  <!-- nodes -->
  <circle cx="8"  cy="9"  r="2.2" fill="#0c1226" stroke="#7c4dff" stroke-width="1.2"/>
  <circle cx="24" cy="9"  r="2.2" fill="#0c1226" stroke="#7c4dff" stroke-width="1.2"/>
  <circle cx="9"  cy="24" r="1.8" fill="#0c1226" stroke="#38e8d4" stroke-width="1.2"/>
  <circle cx="23" cy="24" r="1.8" fill="#0c1226" stroke="#38e8d4" stroke-width="1.2"/>
  <circle cx="16" cy="12" r="2.6" fill="#0c1226" stroke="#38e8d4" stroke-width="1.4"/>
  <circle cx="16" cy="22" r="2.2" fill="#0c1226" stroke="#7c4dff" stroke-width="1.2"/>
</svg>
